# Tests + packaging check on every push/PR. Produces build artifacts but never
# publishes a GitHub release and never signs (the signing key stays offline).
name: CI
on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests
      - name: Package
        run: powershell -ExecutionPolicy Bypass -File scripts/build.ps1 -SkipTests
      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: kasaos-unsigned-${{ github.sha }}
          path: release/
